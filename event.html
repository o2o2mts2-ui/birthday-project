    <style>

            font-size: 13px;

            font-family: monospace;
            font-size: 12px;

<script>

    // URL에서 이벤트 ID 가져오기
    const params =
        new URLSearchParams(location.search);

    const eventId =
        params.get("id");

        let resultImageUrl = "";
        let q1WrongImageUrl = "";


    // 이벤트 불러오기
    async function loadEvent() {

    const { data: event, error } = await supabaseClient
        .from("birthday_events")
        .select("*")
        .eq("id", eventId)
        .single();


    if (error || !event) {

        console.error(error);

        alert("이벤트를 찾을 수 없습니다.");

        location.href = "admin.html";

        return;
    }


    // 기본 정보
    document.getElementById("eventId").textContent =
        event.id;

    document.getElementById("eventName").value =
        event.name || "";

    document.getElementById("recipientName").value =
        event.recipient || "";


    // Q1
    document.getElementById("q1Question").value =
        event.q1_question || "";

    document.getElementById("q1AnswerA").value =
        event.q1_answer_a || "";

    document.getElementById("q1AnswerB").value =
        event.q1_answer_b || "";

    document.getElementById("q1CorrectAnswer").value =
    event.q1_correct_answer || "A";

q1WrongImageUrl = event.q1_wrong_image || "";

    document.getElementById("q1WrongMessage").value =
        event.q1_wrong_message ||
        "진짜로 그렇게 생각한다고? 다시 생각해봐";


    // Q2
    document.getElementById("q2Question").value =
        event.q2_question || "";

    document.getElementById("q2AnswerA").value =
        event.q2_answer_a || "";

    document.getElementById("q2AnswerB").value =
        event.q2_answer_b || "";


    // Q3
    document.getElementById("q3Question").value =
        event.q3_question || "";


    // 결과 화면
    document.getElementById("resultTitle").value =
        event.result_title || "";

    document.getElementById("resultMessage").value =
        event.result_message || "";

    document.getElementById("music").value =
        event.music || "";
        resultImageUrl = event.result_image || "";

}


    // ==============================
// 결과 사진 / GIF 업로드
// ==============================

const resultImageFile =
    document.getElementById("resultImageFile");

resultImageFile.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    try {

        const previewUrl = URL.createObjectURL(file);

        document.getElementById("resultImagePreviewImg").src =
            previewUrl;

        document.getElementById("resultImagePreview").style.display =
            "block";

        const fileExtension =
            file.name.split(".").pop();

        const filePath =
            `${eventId}/result-${Date.now()}.${fileExtension}`;

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("birthday-images")
                .upload(filePath, file, {
                    cacheControl: "3600",
                    upsert: false
                });

        if (uploadError) {

            console.error(
                "이미지 업로드 실패:",
                uploadError
            );

            alert(
                "사진/GIF 업로드에 실패했습니다.\n\n" +
                uploadError.message
            );

            return;
        }

        const { data } =
            supabaseClient
                .storage
                .from("birthday-images")
                .getPublicUrl(filePath);

        resultImageUrl = data.publicUrl;

        console.log(
            "이미지 업로드 완료:",
            resultImageUrl
        );

    } catch (error) {

        console.error(
            "이미지 처리 오류:",
            error
        );

        alert("이미지 처리 중 오류가 발생했습니다.");
    }

});


// ==============================
// Q1 오답 이미지 / GIF 업로드
// ==============================

const q1WrongImageFile =
    document.getElementById("q1WrongImageFile");

q1WrongImageFile.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    try {

        const previewUrl = URL.createObjectURL(file);

        document.getElementById("q1WrongImagePreviewImg").src =
            previewUrl;

        document.getElementById("q1WrongImagePreview").style.display =
            "block";

        const fileExtension =
            file.name.split(".").pop();

        const filePath =
            `${eventId}/q1-wrong-${Date.now()}.${fileExtension}`;

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("birthday-images")
                .upload(filePath, file, {
                    cacheControl: "3600",
                    upsert: false
                });

        if (uploadError) {

            console.error(
                "Q1 오답 이미지 업로드 실패:",
                uploadError
            );

            alert(
                "Q1 오답 이미지 업로드에 실패했습니다.\n\n" +
                uploadError.message
            );

            return;
        }

        const { data } =
            supabaseClient
                .storage
                .from("birthday-images")
                .getPublicUrl(filePath);

        q1WrongImageUrl = data.publicUrl;

        console.log(
            "Q1 오답 이미지 업로드 완료:",
            q1WrongImageUrl
        );

    } catch (error) {

        console.error(
            "Q1 오답 이미지 처리 오류:",
            error
        );

        alert(
            "Q1 오답 이미지 처리 중 오류가 발생했습니다."
        );
    }

});

    // 이벤트 저장
    async function saveEvent() {

    const q1 = {
        question:
            document.getElementById("q1Question").value,

        answerA:
            document.getElementById("q1AnswerA").value,

        answerB:
            document.getElementById("q1AnswerB").value,

        correctAnswer:
            document.getElementById("q1CorrectAnswer").value,

       

        wrongMessage:
            document.getElementById("q1WrongMessage").value
    };


    const q2 = {
        question:
            document.getElementById("q2Question").value,

        answerA:
            document.getElementById("q2AnswerA").value,

        answerB:
            document.getElementById("q2AnswerB").value
    };


    const q3 = {
        question:
            document.getElementById("q3Question").value
    };


    const { error } = await supabaseClient
        .from("birthday_events")
        .upsert({
            id: eventId,

            name:
                document.getElementById("eventName").value,

            recipient:
                document.getElementById("recipientName").value,

            active: true,

            q1_question: q1.question,
            q1_answer_a: q1.answerA,
            q1_answer_b: q1.answerB,
            q1_correct_answer: q1.correctAnswer,
            q1_wrong_image: q1WrongImageUrl,
            q1_wrong_message: q1.wrongMessage,

            q2_question: q2.question,
            q2_answer_a: q2.answerA,
            q2_answer_b: q2.answerB,

            q3_question: q3.question,

            result_title:
                document.getElementById("resultTitle").value,

            result_message:
                document.getElementById("resultMessage").value,

            music:
                document.getElementById("music").value,
                result_image: resultImageUrl
        });


    if (error) {
        console.error(error);

        alert(
            "저장에 실패했습니다.\n\n" +
            error.message
        );

        return;
    }


    alert("저장되었습니다.");

    location.href = "admin.html";
}


    // 목록으로 돌아가기
    function goBack() {

        location.href = "admin.html";

    }


    // 관리자 로그인 여부 확인
async function checkAdminSession() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.replace("index.html");
        return false;
    }

    return true;
}

// 페이지 시작
async function initializeEventPage() {
    const isLoggedIn = await checkAdminSession();

    if (!isLoggedIn) {
        return;
    }

    loadEvent();
}

initializeEventPage();

</script>

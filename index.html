<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Studio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;

            background: #f5f5f5;
            color: #202020;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           로그인 영역
        ========================= */

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }


        .login-card {
            background: #ffffff;

            border: 1px solid #e7e7e7;
            border-radius: 18px;

            padding: 42px 36px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.05);
        }


        /* =========================
           로고
        ========================= */

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }


        .logo-mark {
            width: 48px;
            height: 48px;

            margin: 0 auto 18px;

            border-radius: 14px;

            background: #222222;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
            font-weight: 600;
        }


        .logo-title {
            margin: 0;

            font-size: 23px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }


        .logo-subtitle {
            margin: 8px 0 0;

            font-size: 13px;
            color: #999999;
        }


        /* =========================
           입력 영역
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #555555;
        }


        .password-input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #dddddd;
            border-radius: 10px;

            background: #ffffff;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        .password-input:focus {
            border-color: #888888;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.05);
        }


        /* =========================
           로그인 버튼
        ========================= */

        .login-button {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 14px;

            background: #222222;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        .login-button:hover {
            background: #333333;
        }


        .login-button:active {
            transform: scale(0.99);
        }


        /* =========================
           @밍밍
        ========================= */

        .creator {
            position: fixed;

            right: 18px;
            bottom: 15px;

            font-size: 11px;
            color: #aaaaaa;

            letter-spacing: 0.3px;

            user-select: none;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 480px) {

            .login-container {
                padding: 18px;
            }

            .login-card {
                padding: 36px 24px;
                border-radius: 16px;
            }

            .creator {
                right: 14px;
                bottom: 12px;
            }

        }

    </style>
</head>


<body>


    <!-- 로그인 카드 -->

    <main class="login-container">

        <section class="login-card">


            <!-- 로고 -->

            <div class="logo">

                <div class="logo-mark">
                    B
                </div>

                <h1 class="logo-title">
                    Birthday Studio
                </h1>

                <p class="logo-subtitle">
                    Birthday Event Manager
                </p>

            </div>


            <!-- 로그인 -->

            <form onsubmit="login(event)">

                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        관리자 비밀번호
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    로그인
                </button>

            </form>


        </section>

    </main>


    <!-- 제작자 표시 -->

    <div class="creator">
        @밍밍
    </div>


    <script>

        function login(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;


            if (password === "") {

                alert("비밀번호를 입력해주세요.");

                return;

            }


            alert("로그인 기능은 다음 단계에서 연결합니다.");

        }

    </script>


</body>
</html>
